<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../img/Subtract.png" type="image/png">
  <title>Relatar Problemas - FURIA</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../theme.css">
  <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
  
</head>
<body>

  <div class="box-background">
    <header>
      <a class="nome brand-link" href="../inicial/inicial.html" aria-label="FURIA - início">
        <img class="brand-mark" src="../img/Subtract.png" alt="">
        <span>FURIA</span>
      </a>

      <h1>Relatar Problemas</h1>

      <div class="user-container">
        <button class="user-icon" id="iconeUsuario" type="button" aria-label="Abrir menu do perfil">
          <img src="../inicial/do-utilizador (2) 1.png" alt="">
        </button>
        <nav class="user-menu" id="menuUsuario" aria-label="Navegação da conta">
          <ul>
            <li><a href="../inicial/inicial.html">Início</a></li>
            <li><a href="../conta/index.html">Conta</a></li>
            <li><a href="../chamados/chamados.html">Chamados</a></li>
          </ul>
          <hr>
          <div class="logout"><a href="../index.html">Sair</a></div>
        </nav>
      </div>
    </header>

  <main>
      <form id="form-problema" data-enviar="problemas">
            <section class="Parte1">
                  <div>
                    <label for="categoria">Categoria do Problema:</label>
                    <select id="categoria" name="categoria" required>
                      <option value="" disabled selected>Selecione a categoria...</option>
                      <option value="sistema">Erro no Sistema / Software</option>
                      <option value="equipamento">Falha em Equipamento</option>
                      <option value="acesso">Problema de Acesso / Senha</option>
                      <option value="processo">Falha Operacional / Processo</option>
                      <option value="outro">Outro Problema</option>
                    </select>
                  </div>

                  <div>
                    <label for="titulo">Título do Relato:</label>
                    <input type="text" id="titulo" name="titulo" placeholder="Ex: Erro ao gerar relatório mensal" required>
                  </div>

                  <div>
                    <label for="descricao">Descrição Detalhada:</label><br>
                    <textarea id="descricao" name="descricao" rows="5" placeholder="Descreva o que aconteceu, os passos para reproduzir o erro ou qualquer detalhe relevante..." required></textarea>
                </div>
              </section>
                
            <section class="Parte2">
                  <div class="arquivosa">
                    <label for="arquivos">Anexar Captura de Tela ou Imagem (Opcional):</label><br>
                    <input type="file" id="arquivos" name="anexo" accept="image/*,.pdf">
                  </div>
            </section>
      </form>
      <button type="submit" form="form-problema">Enviar Relatório</button>
      <p id="formMessage" class="form-message erro" role="alert" aria-live="assertive"></p>
      <!-- adriel esteve aqui -->
    </main>
  </div>

  <script src="../javascript/script.js" defer></script>
  <script src="../javascript/forms.js" defer></script>
</body>
</html>
