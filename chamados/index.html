<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../assets/img/logo-furia.png" type="image/png">
  <title>Meus Chamados - FURIA</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Estilos Padronizados -->
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/pages/chamados.css">
</head>

<body>
  <div class="container">
    <!-- Header Global -->
    <header class="app-header">
      <a class="brand-link" href="../inicial/index.html" aria-label="FURIA - Início">
        <img class="brand-mark" src="../assets/img/logo-furia.png" alt="FURIA Logo">
        <span>FURIA</span>
      </a>

      <h1>Meus Chamados</h1>

      <!-- Menu do Usuário -->
      <div class="user-container">
        <button class="user-icon" id="iconeUsuario" type="button" aria-label="Abrir menu do perfil" aria-expanded="false">
          <img src="../assets/img/avatar.png" alt="Avatar do usuário">
        </button>

        <nav class="user-menu" id="menuUsuario" aria-label="Menu da conta">
          <ul>
            <li><a href="../inicial/index.html">🏠 Início</a></li>
            <li><a href="../chamados/index.html">📋 Meus Chamados</a></li>
            <li><a href="../conta/index.html">👤 Minha Conta</a></li>
          </ul>
          <hr>
          <div class="logout">
            <a href="../index.html">Sair da conta &rarr;</a>
          </div>
        </nav>
      </div>
    </header>

    <!-- Botão de Voltar -->
    <div class="nav-bar">
      <a href="../inicial/index.html" class="btn-voltar">&larr; Voltar para a Tela Inicial</a>
    </div>

    <!-- Barra de Filtros por Status -->
    <section class="chamados-header-section">
      <div>
        <h2>Histórico de Chamados</h2>
        <p class="text-muted">Acompanhe o status e a resolução dos seus pedidos técnicos.</p>
      </div>

      <div class="chamados-filters">
        <button type="button" class="filter-btn active" data-filter="todos">Todos</button>
        <button type="button" class="filter-btn" data-filter="Recebido">Recebidos</button>
        <button type="button" class="filter-btn" data-filter="Em andamento">Em andamento</button>
        <button type="button" class="filter-btn" data-filter="Concluído">Concluídos</button>
      </div>
    </section>

    <!-- Lista Dinâmica de Chamados -->
    <main class="chamados-grid" id="chamadosList" aria-live="polite">
      <p class="chamados-empty">Carregando seus chamados...</p>
    </main>
  </div>

  <!-- Scripts -->
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/pages/chamados.js"></script>
</body>

</html>
