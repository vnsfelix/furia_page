<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="./assets/img/logo-furia.png" type="image/png">
  <title>FURIA - Login Seguro</title>

  <!-- Google Fonts: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Estilos Padronizados -->
  <link rel="stylesheet" href="./assets/css/base.css">
  <link rel="stylesheet" href="./assets/css/components.css">
  <link rel="stylesheet" href="./assets/css/pages/login.css">
</head>

<body>
  <div class="auth-page">
    <div class="auth-layout">
      <!-- Marca FURIA -->
      <header class="auth-brand">
        <img class="brand-mark" src="./assets/img/logo-furia.png" alt="Logo FURIA">
        <span>FURIA <span class="brand-divider">/</span> CENTRAL INTERNA</span>
      </header>

      <main class="auth-card">
        <p class="auth-eyebrow">ACESSO SEGURO</p>
        <h2>Bem-vindo de volta</h2>

        <!-- Formulário de Login com Email e Senha -->
        <form id="loginForm" novalidate>
          <div class="form-group">
            <label for="email">E-mail corporativo / pessoal</label>
            <input 
              type="email" 
              name="email" 
              id="email" 
              placeholder="exemplo@furia.gg" 
              autocomplete="email" 
              required
            >
          </div>

          <div class="form-group">
            <label for="password">Senha de acesso</label>
            <div class="input-password-wrapper">
              <input 
                type="password" 
                name="password" 
                id="password" 
                placeholder="Digite sua senha" 
                autocomplete="current-password" 
                required
              >
              <button type="button" class="toggle-password-btn" data-target="password" aria-label="Mostrar senha">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-icon"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>

          <div class="auth-sub-actions">
            <label class="remember-me">
              <input type="checkbox" id="rememberMe">
              <span>Lembrar de mim</span>
            </label>
            <a href="#" id="esqueciSenha" class="forgot-link">Esqueci minha senha</a>
          </div>

          <button type="submit" class="btn auth-submit-btn">Entrar na Conta</button>
        </form>

        <!-- Mensagens de Alerta (Sucesso ou Erro) -->
        <div id="loginMessage" class="alert alert-error" role="alert" aria-live="assertive"></div>

        <div class="auth-divider">
          <span>OU</span>
        </div>

        <!-- Botão de Cadastro Novo Usuário -->
        <a href="./cadastro.html" class="btn-auth-switch" id="btnIrCadastro">
          <span>Não tem uma conta?</span>
          <strong class="text-accent">Cadastre-se aqui →</strong>
        </a>

        <p class="auth-footnote">Ambiente restrito e monitorado para colaboradores e equipe FURIA.</p>
      </main>
    </div>
  </div>

  <!-- Scripts do Sistema -->
  <script src="./assets/js/app.js"></script>
  <script src="./assets/js/pages/login.js"></script>
</body>

</html>
