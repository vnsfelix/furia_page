<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../assets/img/logo-furia.png" type="image/png">
  <title>Relatar Problema - FURIA</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Estilos Padronizados -->
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/pages/problemas.css">
</head>

<body>
  <div class="container">
    <!-- Header Global -->
    <header class="app-header">
      <a class="brand-link" href="../inicial/index.html" aria-label="FURIA - Início">
        <img class="brand-mark" src="../assets/img/logo-furia.png" alt="FURIA Logo">
        <span>FURIA</span>
      </a>

      <h1>Relatar Problemas</h1>

      <!-- Menu do Usuário -->
      <div class="user-container">
        <button class="user-icon" id="iconeUsuario" type="button" aria-label="Abrir menu do perfil" aria-expanded="false">
          <img src="../assets/img/avatar.png" alt="Avatar do usuário">
        </button>

        <nav class="user-menu" id="menuUsuario" aria-label="Menu da conta">
          <ul>
            <li><a href="../inicial/index.html">Início</a></li>
            <li><a href="../chamados/index.html">Meus Chamados</a></li>
            <li><a href="../conta/index.html">Minha Conta</a></li>
          </ul>
          <hr>
          <div class="logout">
            <a href="../index.html">Sair da conta &rarr;</a>
          </div>
        </nav>
      </div>
    </header>

    <!-- Botão de Voltar -->
    <div class="nav-bar">
      <a href="../inicial/index.html" class="btn-voltar">&larr; Voltar para a Tela Inicial</a>
    </div>

    <!-- Formulário do Chamado -->
    <main class="form-wrapper">
      <div class="ticket-form-card">
        <div class="form-header-intro">
          <p class="eyebrow">SUPORTE DIGITAL</p>
          <h2>Abertura de Chamado Técnico</h2>
          <p>Descreva detalhadamente o problema com sistema, software ou equipamento para nossa equipe resolver com agilidade.</p>
        </div>

        <form id="form-problema" class="ticket-form" data-tipo-chamado="problemas" novalidate>
          <div class="form-row">
            <div class="form-group">
              <label for="categoria">Categoria da ocorrência</label>
              <select id="categoria" name="categoria" required>
                <option value="" disabled selected>Selecione a categoria...</option>
                <option value="sistema">Erro no Sistema / Software</option>
                <option value="equipamento">Falha em Equipamento / Hardware</option>
                <option value="acesso">Problema de Acesso / Senha</option>
                <option value="processo">Falha Operacional / Processo</option>
                <option value="outro">Outro Problema</option>
              </select>
            </div>

            <div class="form-group">
              <label for="urgencia">Nível de urgência</label>
              <select id="urgencia" name="urgencia" required>
                <option value="baixa">Baixa (Não impede o trabalho)</option>
                <option value="media" selected>Média (Atrapalha atividades)</option>
                <option value="alta">Alta (Impede completamente a operação)</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="titulo">Título resumido do relato</label>
            <input type="text" id="titulo" name="titulo" placeholder="Ex.: Erro 500 ao emitir relatório de partidas" required>
          </div>

          <div class="form-group">
            <label for="descricao">Descrição detalhada</label>
            <textarea id="descricao" name="descricao" rows="5" placeholder="Explique o que aconteceu, passos para reproduzir o problema e quais mensagens foram exibidas..." required></textarea>
          </div>

          <div class="form-group">
            <label>Anexo opcional (Imagem ou Captura de tela)</label>
            <label class="file-upload-box" for="arquivos">
              <input type="file" id="arquivos" name="anexo" accept="image/*,.pdf">
              <span class="file-upload-icon">📁</span>
              <span class="file-upload-text" id="fileLabel">Clique ou arraste um arquivo para anexar</span>
              <span class="file-upload-hint">Formatos suportados: PNG, JPG, PDF (máx. 10MB)</span>
            </label>
          </div>

          <button type="submit" class="btn">Enviar Solicitação</button>
        </form>

        <!-- Mensagem de Alerta (sem a classe de erro fixa anterior) -->
        <div id="formMessage" class="alert alert-error" role="alert" aria-live="assertive"></div>
      </div>
    </main>
  </div>

  <!-- Scripts -->
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/pages/problemas.js"></script>
</body>

</html>
