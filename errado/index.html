
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../assets/img/logo-furia.png" type="image/png">
  <title>Ocorreu um Erro - FURIA</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Estilos Padronizados -->
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/pages/errado.css">
</head>

<body>
  <div class="container">
    <!-- Header Global -->
    <header class="app-header">
      <a class="brand-link" href="../inicial/index.html" aria-label="FURIA - Início">
        <img class="brand-mark" src="../assets/img/logo-furia.png" alt="FURIA Logo">
        <span>FURIA</span>
      </a>

      <h1>Aviso do Sistema</h1>

      <!-- Menu do Usuário -->
      <div class="user-container">
        <button class="user-icon" id="iconeUsuario" type="button" aria-label="Abrir menu do perfil" aria-expanded="false">
          <img src="../assets/img/avatar.png" alt="Avatar do usuário">
        </button>

        <nav class="user-menu" id="menuUsuario" aria-label="Menu da conta">
          <ul>
            <li><a href="../inicial/index.html">Início</a></li>
            <li><a href="../chamados/index.html">Meus Chamados</a></li>
            <li><a href="../conta/index.html">Minha Conta</a></li>
          </ul>
          <hr>
          <div class="logout">
            <a href="../index.html">Sair da conta &rarr;</a>
          </div>
        </nav>
      </div>
    </header>

    <!-- Card de Erro -->
    <main class="error-card">
      <div class="error-icon">⚠️</div>
      <div class="error-code">Atenção / Falha na Ação</div>
      <h2>Algo não saiu como esperado</h2>
      <p id="errorDescription">Ocorreu uma instabilidade ou falha temporária ao processar esta ação. Verifique os dados e tente novamente.</p>

      <div class="error-actions">
        <a href="javascript:history.back()" class="btn">Tentar Novamente</a>
        <a href="../inicial/index.html" class="btn btn-secondary">Voltar ao Início</a>
      </div>
    </main>
  </div>

  <!-- Scripts -->
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/pages/errado.js"></script>
</body>

</html>
