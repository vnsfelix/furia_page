<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../img/Subtract.png" type="image/png">
  <title>Chamados Presenciais - FURIA</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <div class="box-background">
    <header>
      <a class="nome brand-link" href="../inicial/inicial.html" aria-label="FURIA - início">
        <img class="brand-mark" src="../img/Subtract.png" alt="">
        <span>FURIA</span>
      </a>

      <h1>Chamados Presenciais</h1>

      <div class="user-container">
        <button class="user-icon" id="iconeUsuario" type="button" aria-label="Abrir menu do perfil">
          <img src="../inicial/do-utilizador (2) 1.png" alt="">
        </button>
        <nav class="user-menu" id="menuUsuario" aria-label="Navegação da conta">
          <ul>
            <li><a href="../inicial/inicial.html">Início</a></li>
            <li><a href="../conta/index.html">Conta</a></li>
            <li><a href="../chamados/chamados.html">Chamados</a></li>
          </ul>
          <hr>
          <div class="logout"><a href="../index.html">Sair</a></div>
        </nav>
      </div>
    </header>

    <div class="CENTER">
      <main>
        <form id="form-chamado" data-enviar="presencial">
          
          <div class="LocalOco">
            <label for="local">Local da Ocorrência:</label>
            <select id="local" name="local" required>
              <option value="" disabled selected>Selecione o local...</option>
              <option value="recepcao">Recepção</option>
              <option value="estudio">Estúdio / Arena</option>
              <option value="escritorio-adm">Escritório Administrativo</option>
              <option value="sala-reunioes">Sala de Reuniões</option>
              <option value="refeitorio">Refeitório</option>
              <option value="deposito">Depósito / Almoxarifado</option>
            </select>
          </div>
  
          <div>
            <label for="tipo-servico">Tipo de Chamado:</label>
            <select id="tipo-servico" name="tipo-servico" required>
              <option value="" disabled selected>Selecione o tipo de problema...</option>
              <option value="hardware">Suporte de Informática / Hardware</option>
              <option value="redes">Rede / Internet</option>
              <option value="eletrica">Manutenção Elétrica</option>
              <option value="limpeza">Limpeza / Organização</option>
              <option value="estrutura">Infraestrutura / Reparo Geral</option>
            </select>
          </div>
  
          <div>
            <label for="descricao">Descrição do Problema:</label>
            <textarea id="descricao" name="descricao" rows="5" placeholder="Descreva detalhadamente o erro ou o que precisa ser corrigido no local..." required></textarea>
          </div>
  
          <div>
            <label for="urgencia">Nível de Urgência:</label>
            <select id="urgencia" name="urgencia" required>
              <option value="baixa">Baixa</option>
              <option value="media" selected>Média</option>
              <option value="alta">Alta (Impede o trabalho)</option>
            </select>
          </div>
  
          <div>
      <button type="submit">Solicitar Presença do Técnico</button>
          </div>
  
        </form>
        <p id="formMessage" class="form-message erro" role="alert" aria-live="assertive"></p>
      </main>
    </div>
  </div>

  

  <script src="../javascript/script.js" defer></script>
  <script src="../javascript/forms.js" defer></script>
</body>
</html>
