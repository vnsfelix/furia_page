<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../img/Design_sem_nome_2.png">
  <title>Comunicação entre Áreas - FURIA</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <div class="container">
    <header>
      <div class="logo">
        <span>FURIA</span>
      </div>

      <h1>Comunicação entre Áreas</h1>

      <div class="profile">
        <span>👤</span>
      </div>
    </header>

    <main>
      <form id="form-comunicacao" data-enviar="comunicacao">
        
        <div>
          <label for="area-destino">Selecione a área de destino:</label>
          <select id="area-destino" name="area-destino" required>
            <option value="" disabled selected>Escolha uma área...</option>
            <option value="ti">Tecnologia da Informação (TI)</option>
            <option value="manutencao">Manutenção</option>
            <option value="rh">Recursos Humanos</option>
            <option value="financeiro">Financeiro</option>
            <option value="operacoes">Operações</option>
          </select>
        </div>

        <div>
          <label for="assunto">Assunto:</label>
          <input type="text" id="assunto" name="assunto" placeholder="Digite o assunto principal..." required>
        </div>

        <div>
          <label for="mensagem">Mensagem:</label>
          <textarea id="mensagem" name="mensagem" rows="6" placeholder="Escreva aqui a mensagem para o setor..." required></textarea>
        </div>

        <div>
      <button type="submit">Enviar Mensagem</button>
        </div>

      </form>
    </main>
  </div>

  <script src="../javascript/forms.js"></script>
</body>
</html>
