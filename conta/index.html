<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../img/Subtract.png" type="image/png">

    <title>Minha Conta | FURIA</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../css/theme.css">
    <script src="../javascript/script.js" defer></script>
    <script src="script.js" defer></script>
</head>

<body>
    <div class="container">

        <header class="header">
            <a href="../inicial/inicial.html" class="logo brand-link" aria-label="FURIA - início">
                <img class="brand-mark" src="../img/Subtract.png" alt="">
                <span>FURIA</span>
            </a>

            <h1>Minha Conta</h1>

            <div class="user-container">
                <button class="user-icon" id="iconeUsuario" type="button" aria-label="Abrir menu do perfil">
                    <img src="../inicial/do-utilizador (2) 1.png" alt="">
                </button>
                <nav class="user-menu" id="menuUsuario" aria-label="Navegação da conta">
                    <ul>
                        <li><a href="../inicial/inicial.html">Início</a></li>
                        <li><a href="../conta/index.html">Conta</a></li>
                        <li><a href="../chamados/chamados.html">Chamados</a></li>
                    </ul>
                    <hr>
                    <div class="logout"><a href="../index.html">Sair</a></div>
                </nav>
            </div>
        </header>
        <nav class="nav-bar" aria-label="Navegação">
            <a href="../inicial/inicial.html" class="btn-voltar">← Voltar para o início</a>
        </nav>

        <main class="perfil-container">

            <section class="perfil-topo">
                <div class="avatar" id="avatar">U</div>

                <div class="perfil-identificacao">
                    <h2 id="nomeExibido">Nome do usuário</h2>
                    <p id="rmExibido">RM não informado</p>
                    <span class="status">Minha conta</span>
                </div>

                <button id="editarBtn" class="btn btn-secundario"
                        type="button">
                    Editar perfil
                </button>
            </section>

            <form id="perfilForm">

                <section class="secao">
                    <h3>Dados do usuário</h3>
                    <p class="descricao">
                        Consulte e atualize seu nome e RM.
                    </p>

                    <div class="form-grid">

                        <div class="campo">
                            <label for="nome">Nome completo</label>
                            <input id="nome" name="nome"
                                   type="text"
                                   placeholder="Seu nome completo"
                                   autocomplete="name"
                                   required disabled>
                        </div>

                        <div class="campo">
                            <label for="rm">RM / Identificação</label>
                            <input id="rm" name="rm"
                                   type="text"
                                   placeholder="Seu RM"
                                   autocomplete="off"
                                   required disabled>
                        </div>

                    </div>
                </section>

                <div class="acoes" id="acoes" hidden>
                    <button type="button" id="cancelarBtn"
                            class="btn btn-cancelar">
                        Cancelar
                    </button>

                    <button type="submit" class="btn btn-principal">
                        Salvar alterações
                    </button>
                </div>

                <p id="mensagem" class="mensagem"
                   role="status" aria-live="polite"></p>

            </form>
        </main>
    </div>
</body>
</html>
