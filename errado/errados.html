<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../img/Subtract.png" type="image/png">
  <title>Erro no Sistema</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../css/theme.css">
</head>
<body>
  <header class="header">
    <a class="logo brand-link" href="../inicial/inicial.html" aria-label="FURIA - início">
      <img class="brand-mark" src="../img/Subtract.png" alt="">
      <span>FURIA</span>
    </a>
    <h1>Erro no sistema</h1>
    <div class="user-container">
      <button class="user-icon" id="iconeUsuario" type="button" aria-label="Abrir menu do perfil">
        <img src="../inicial/do-utilizador (2) 1.png" alt="">
      </button>
      <nav class="user-menu" id="menuUsuario" aria-label="Navegação da conta">
        <ul>
          <li><a href="../inicial/inicial.html">Início</a></li>
          <li><a href="../conta/index.html">Conta</a></li>
          <li><a href="../chamados/chamados.html">Chamados</a></li>
        </ul>
        <hr>
        <div class="logout"><a href="../index.html">Sair</a></div>
      </nav>
    </div>
  </header>

  <main class="error-container">
    <div class="error-card">
      <div class="error-icon">⚠️</div>
      <div class="error-code">ERROR</div>
      <h1 class="error-title">OCORREU UM ERRO</h1>
      <p class="error-description">Ocorreu uma falha nessa ação, recarregue a página e revise tudo novamente.</p>
      <a href="../inicial/inicial.html" class="btn-retry">Tentar Novamente</a>
    </div>
  </main>
  <script src="../javascript/script.js" defer></script>
</body>
</html>
